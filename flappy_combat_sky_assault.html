<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Flappy Combat: Sky Assault</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- FontAwesome Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700;900&family=Press+Start+2P&display=swap');
        
        body {
            font-family: 'Orbitron', sans-serif;
            user-select: none;
            -webkit-user-select: none;
            touch-action: manipulation;
        }

        .font-retro {
            font-family: 'Press Start 2P', monospace;
        }

        /* Screen Shake Effect */
        .shake {
            animation: shake 0.2s cubic-bezier(.36,.07,.19,.97) both;
        }

        @keyframes shake {
            10%, 90% { transform: translate3d(-2px, 0, 0); }
            20%, 80% { transform: translate3d(4px, 0, 0); }
            30%, 50%, 70% { transform: translate3d(-6px, 0, 0); }
            40%, 60% { transform: translate3d(6px, 0, 0); }
        }

        /* Custom Scrollbar for High Score Overlay if needed */
        ::-webkit-scrollbar {
            width: 6px;
        }
        ::-webkit-scrollbar-track {
            background: rgba(0, 0, 0, 0.2);
        }
        ::-webkit-scrollbar-thumb {
            background: rgba(255, 255, 255, 0.3);
            border-radius: 3px;
        }
    </style>
</head>
<body class="bg-slate-900 text-white h-screen w-screen overflow-hidden flex flex-col justify-center items-center">

    <!-- Main Game Container -->
    <div id="game-container" class="relative w-full h-full max-w-5xl max-h-[700px] md:rounded-2xl overflow-hidden shadow-2xl bg-slate-950 border border-slate-800">
        
        <!-- Canvas Element -->
        <canvas id="gameCanvas" class="w-full h-full block cursor-pointer"></canvas>

        <!-- TOP HUD -->
        <div id="hud" class="absolute top-0 left-0 w-full p-4 flex justify-between items-center pointer-events-none hidden">
            <!-- Health & Energy -->
            <div class="flex flex-col gap-2">
                <!-- HP Bar -->
                <div class="flex items-center gap-2 bg-slate-900/80 backdrop-blur border border-slate-700 px-3 py-1.5 rounded-xl">
                    <i class="fa-solid fa-heart text-red-500 animate-pulse"></i>
                    <div class="w-32 md:w-48 h-4 bg-slate-800 rounded-full overflow-hidden p-0.5 border border-slate-700">
                        <div id="hp-fill" class="h-full bg-gradient-to-r from-red-600 via-rose-500 to-emerald-400 rounded-full transition-all duration-200" style="width: 100%;"></div>
                    </div>
                    <span id="hp-text" class="text-xs font-bold font-mono">100/100</span>
                </div>
                <!-- Energy / Dash Cooldown -->
                <div class="flex items-center gap-2 bg-slate-900/80 backdrop-blur border border-slate-700 px-3 py-1.5 rounded-xl">
                    <i class="fa-solid fa-bolt text-amber-400"></i>
                    <div class="w-32 md:w-48 h-3 bg-slate-800 rounded-full overflow-hidden p-0.5 border border-slate-700">
                        <div id="dash-fill" class="h-full bg-gradient-to-r from-amber-500 to-yellow-300 rounded-full transition-all duration-100" style="width: 100%;"></div>
                    </div>
                    <span id="dash-text" class="text-[10px] font-bold font-mono text-amber-300">DASH READY</span>
                </div>
            </div>

            <!-- Score & Combo -->
            <div class="flex flex-col items-end">
                <div class="text-3xl md:text-4xl font-extrabold tracking-wider font-retro text-amber-400 drop-shadow-[0_2px_4px_rgba(0,0,0,0.8)]" id="score-display">0</div>
                <div id="combo-display" class="text-xs md:text-sm font-bold text-cyan-400 opacity-0 transition-all transform scale-75">
                    COMBO <span id="combo-count" class="text-lg text-yellow-300">x1</span>
                </div>
                <div id="active-powerup" class="mt-1 text-xs font-semibold text-emerald-400 hidden bg-slate-900/90 px-2 py-0.5 rounded border border-emerald-500/50">
                    <i class="fa-solid fa-wand-magic-sparkles mr-1"></i><span id="powerup-text">POWERUP</span>
                </div>
            </div>
        </div>

        <!-- MOBILE TOUCH CONTROLS OVERLAY -->
        <div id="mobile-controls" class="absolute bottom-4 left-0 w-full px-6 flex justify-between items-center pointer-events-auto md:hidden hidden">
            <button id="btn-flap" class="w-20 h-20 bg-cyan-600/60 active:bg-cyan-500/80 border-2 border-cyan-300/50 rounded-full flex flex-col justify-center items-center shadow-lg backdrop-blur select-none">
                <i class="fa-solid fa-arrow-up text-2xl text-white"></i>
                <span class="text-[10px] font-bold mt-0.5">FLAP</span>
            </button>
            <div class="flex gap-3">
                <button id="btn-dash" class="w-16 h-16 bg-amber-600/60 active:bg-amber-500/80 border-2 border-amber-300/50 rounded-full flex flex-col justify-center items-center shadow-lg backdrop-blur select-none">
                    <i class="fa-solid fa-forward-fast text-xl text-white"></i>
                    <span class="text-[9px] font-bold mt-0.5">DASH</span>
                </button>
                <button id="btn-shoot" class="w-20 h-20 bg-rose-600/60 active:bg-rose-500/80 border-2 border-rose-300/50 rounded-full flex flex-col justify-center items-center shadow-lg backdrop-blur select-none">
                    <i class="fa-solid fa-crosshairs text-2xl text-white"></i>
                    <span class="text-[10px] font-bold mt-0.5">SHOOT</span>
                </button>
            </div>
        </div>

        <!-- MAIN MENU OVERLAY -->
        <div id="main-menu" class="absolute inset-0 bg-slate-950/90 backdrop-blur-md flex flex-col justify-center items-center p-6 text-center z-10">
            <div class="relative mb-6">
                <h1 class="text-4xl md:text-6xl font-black font-retro text-transparent bg-clip-text bg-gradient-to-r from-cyan-400 via-sky-300 to-indigo-500 tracking-wider drop-shadow-lg">
                    FLAPPY COMBAT
                </h1>
                <p class="text-xs md:text-sm text-cyan-400 tracking-widest uppercase mt-2 font-semibold">Sky Assault Arcade</p>
            </div>

            <!-- High Score Display -->
            <div class="bg-slate-900/90 border border-slate-800 rounded-xl px-6 py-3 mb-6 flex items-center gap-3 shadow-inner">
                <i class="fa-solid fa-trophy text-amber-400 text-xl"></i>
                <span class="text-slate-400 text-sm">BEST SCORE:</span>
                <span id="best-score" class="text-amber-400 font-retro text-lg">0</span>
            </div>

            <!-- Controls Guide -->
            <div class="grid grid-cols-1 md:grid-cols-3 gap-3 w-full max-w-xl mb-8 text-xs text-slate-300">
                <div class="bg-slate-900/80 p-3 rounded-lg border border-slate-800 flex flex-col items-center">
                    <div class="text-cyan-400 font-bold mb-1 flex items-center gap-1"><i class="fa-solid fa-angles-up"></i> FLAP / FLY</div>
                    <span class="bg-slate-800 px-2 py-1 rounded text-[10px] text-slate-300 border border-slate-700 font-mono">SPACE / CLICK / TAP</span>
                </div>
                <div class="bg-slate-900/80 p-3 rounded-lg border border-slate-800 flex flex-col items-center">
                    <div class="text-rose-400 font-bold mb-1 flex items-center gap-1"><i class="fa-solid fa-crosshairs"></i> FIRE LASER</div>
                    <span class="bg-slate-800 px-2 py-1 rounded text-[10px] text-slate-300 border border-slate-700 font-mono">F / J / SHOOT BTN</span>
                </div>
                <div class="bg-slate-900/80 p-3 rounded-lg border border-slate-800 flex flex-col items-center">
                    <div class="text-amber-400 font-bold mb-1 flex items-center gap-1"><i class="fa-solid fa-bolt"></i> DASH ATTACK</div>
                    <span class="bg-slate-800 px-2 py-1 rounded text-[10px] text-slate-300 border border-slate-700 font-mono">D / K / DASH BTN</span>
                </div>
            </div>

            <!-- Start Button -->
            <button id="start-btn" class="px-8 py-4 bg-gradient-to-r from-cyan-500 to-blue-600 hover:from-cyan-400 hover:to-blue-500 text-slate-950 font-black font-retro text-lg rounded-xl shadow-[0_0_20px_rgba(6,182,212,0.5)] transform hover:scale-105 active:scale-95 transition-all cursor-pointer">
                LAUNCH MISSION
            </button>
        </div>

        <!-- GAME OVER OVERLAY -->
        <div id="game-over" class="absolute inset-0 bg-slate-950/95 backdrop-blur-md flex flex-col justify-center items-center p-6 text-center z-20 hidden">
            <h2 class="text-4xl md:text-5xl font-black font-retro text-red-500 mb-2 drop-shadow-[0_0_15px_rgba(239,68,68,0.5)]">
                MISSION FAILED
            </h2>
            <p class="text-xs text-slate-400 uppercase tracking-widest mb-6">Bird Destroyed in Combat</p>

            <!-- Stats Box -->
            <div class="bg-slate-900 border border-slate-800 rounded-2xl p-6 w-full max-w-md mb-6 shadow-2xl flex flex-col gap-3">
                <div class="flex justify-between items-center border-b border-slate-800 pb-2">
                    <span class="text-xs text-slate-400"><i class="fa-solid fa-star text-amber-400 mr-2"></i>FINAL SCORE</span>
                    <span id="final-score" class="font-retro text-amber-400 text-lg">0</span>
                </div>
                <div class="flex justify-between items-center border-b border-slate-800 pb-2">
                    <span class="text-xs text-slate-400"><i class="fa-solid fa-skull text-rose-400 mr-2"></i>ENEMIES DESTROYED</span>
                    <span id="final-kills" class="font-mono text-white text-base">0</span>
                </div>
                <div class="flex justify-between items-center border-b border-slate-800 pb-2">
                    <span class="text-xs text-slate-400"><i class="fa-solid fa-route text-cyan-400 mr-2"></i>DISTANCE FLOWN</span>
                    <span id="final-distance" class="font-mono text-white text-base">0m</span>
                </div>
                <div class="flex justify-between items-center">
                    <span class="text-xs text-slate-400"><i class="fa-solid fa-fire text-orange-400 mr-2"></i>HIGHEST COMBO</span>
                    <span id="final-combo" class="font-mono text-white text-base">x0</span>
                </div>
            </div>

            <!-- Restart Button -->
            <button id="restart-btn" class="px-8 py-4 bg-gradient-to-r from-emerald-400 to-teal-500 hover:from-emerald-300 hover:to-teal-400 text-slate-950 font-black font-retro text-lg rounded-xl shadow-[0_0_20px_rgba(52,211,153,0.4)] transform hover:scale-105 active:scale-95 transition-all cursor-pointer">
                RETRY MISSION
            </button>
        </div>

    </div>

    <script>
        // --- AUDIO SYNTHESIZER (Web Audio API) ---
        class SoundFX {
            constructor() {
                this.ctx = null;
            }

            init() {
                if (!this.ctx) {
                    this.ctx = new (window.AudioContext || window.webkitAudioContext)();
                }
            }

            playJump() {
                if (!this.ctx) return;
                const osc = this.ctx.createOscillator();
                const gain = this.ctx.createGain();
                osc.type = 'sine';
                osc.frequency.setValueAtTime(180, this.ctx.currentTime);
                osc.frequency.exponentialRampToValueAtTime(420, this.ctx.currentTime + 0.1);
                gain.gain.setValueAtTime(0.2, this.ctx.currentTime);
                gain.gain.linearRampToValueAtTime(0.01, this.ctx.currentTime + 0.1);
                osc.connect(gain);
                gain.connect(this.ctx.destination);
                osc.start();
                osc.stop(this.ctx.currentTime + 0.1);
            }

            playShoot() {
                if (!this.ctx) return;
                const osc = this.ctx.createOscillator();
                const gain = this.ctx.createGain();
                osc.type = 'sawtooth';
                osc.frequency.setValueAtTime(800, this.ctx.currentTime);
                osc.frequency.exponentialRampToValueAtTime(150, this.ctx.currentTime + 0.12);
                gain.gain.setValueAtTime(0.15, this.ctx.currentTime);
                gain.gain.linearRampToValueAtTime(0.01, this.ctx.currentTime + 0.12);
                osc.connect(gain);
                gain.connect(this.ctx.destination);
                osc.start();
                osc.stop(this.ctx.currentTime + 0.12);
            }

            playExplosion() {
                if (!this.ctx) return;
                const dur = 0.3;
                const bufferSize = this.ctx.sampleRate * dur;
                const buffer = this.ctx.createBuffer(1, bufferSize, this.ctx.sampleRate);
                const data = buffer.getChannelData(0);
                for (let i = 0; i < bufferSize; i++) {
                    data[i] = Math.random() * 2 - 1;
                }
                const noise = this.ctx.createBufferSource();
                noise.buffer = buffer;

                const filter = this.ctx.createBiquadFilter();
                filter.type = 'lowpass';
                filter.frequency.setValueAtTime(800, this.ctx.currentTime);
                filter.frequency.exponentialRampToValueAtTime(50, this.ctx.currentTime + dur);

                const gain = this.ctx.createGain();
                gain.gain.setValueAtTime(0.3, this.ctx.currentTime);
                gain.gain.linearRampToValueAtTime(0.01, this.ctx.currentTime + dur);

                noise.connect(filter);
                filter.connect(gain);
                gain.connect(this.ctx.destination);
                noise.start();
            }

            playHit() {
                if (!this.ctx) return;
                const osc = this.ctx.createOscillator();
                const gain = this.ctx.createGain();
                osc.type = 'square';
                osc.frequency.setValueAtTime(120, this.ctx.currentTime);
                osc.frequency.setValueAtTime(60, this.ctx.currentTime + 0.05);
                gain.gain.setValueAtTime(0.25, this.ctx.currentTime);
                gain.gain.linearRampToValueAtTime(0.01, this.ctx.currentTime + 0.15);
                osc.connect(gain);
                gain.connect(this.ctx.destination);
                osc.start();
                osc.stop(this.ctx.currentTime + 0.15);
            }

            playPowerup() {
                if (!this.ctx) return;
                const now = this.ctx.currentTime;
                const osc = this.ctx.createOscillator();
                const gain = this.ctx.createGain();
                osc.type = 'triangle';
                osc.frequency.setValueAtTime(300, now);
                osc.frequency.setValueAtTime(450, now + 0.08);
                osc.frequency.setValueAtTime(600, now + 0.16);
                gain.gain.setValueAtTime(0.2, now);
                gain.gain.linearRampToValueAtTime(0.01, now + 0.25);
                osc.connect(gain);
                gain.connect(this.ctx.destination);
                osc.start();
                osc.stop(now + 0.25);
            }

            playDash() {
                if (!this.ctx) return;
                const osc = this.ctx.createOscillator();
                const gain = this.ctx.createGain();
                osc.type = 'sine';
                osc.frequency.setValueAtTime(600, this.ctx.currentTime);
                osc.frequency.exponentialRampToValueAtTime(100, this.ctx.currentTime + 0.2);
                gain.gain.setValueAtTime(0.3, this.ctx.currentTime);
                gain.gain.linearRampToValueAtTime(0.01, this.ctx.currentTime + 0.2);
                osc.connect(gain);
                gain.connect(this.ctx.destination);
                osc.start();
                osc.stop(this.ctx.currentTime + 0.2);
            }
        }

        const audio = new SoundFX();

        const container = document.getElementById('game-container');
        const canvas = document.getElementById('gameCanvas');
        const ctx = canvas.getContext('2d');

        // UI Elements
        const hud = document.getElementById('hud');
        const mobileControls = document.getElementById('mobile-controls');
        const mainMenu = document.getElementById('main-menu');
        const gameOverMenu = document.getElementById('game-over');
        const hpFill = document.getElementById('hp-fill');
        const hpText = document.getElementById('hp-text');
        const dashFill = document.getElementById('dash-fill');
        const dashText = document.getElementById('dash-text');
        const scoreDisplay = document.getElementById('score-display');
        const comboDisplay = document.getElementById('combo-display');
        const comboCount = document.getElementById('combo-count');
        const activePowerupDisplay = document.getElementById('active-powerup');
        const powerupText = document.getElementById('powerup-text');
        const bestScoreDisplay = document.getElementById('best-score');

        // Stats Display
        const finalScore = document.getElementById('final-score');
        const finalKills = document.getElementById('final-kills');
        const finalDistance = document.getElementById('final-distance');
        const finalCombo = document.getElementById('final-combo');

        // Game State Variables
        let isRunning = false;
        let score = 0;
        let kills = 0;
        let distance = 0;
        let combo = 0;
        let maxCombo = 0;
        let highScore = parseInt(localStorage.getItem('flappy_combat_highscore')) || 0;
        bestScoreDisplay.innerText = highScore;

        // Canvas Sizing
        function resizeCanvas() {
            canvas.width = container.clientWidth;
            canvas.height = container.clientHeight;
        }
        window.addEventListener('resize', resizeCanvas);
        resizeCanvas();

        const player = {
            x: 100,
            y: 300,
            radius: 18,
            vy: 0,
            gravity: 0.45,
            jumpStrength: -8.5,
            hp: 100,
            maxHp: 100,
            dashEnergy: 100,
            dashCooldown: false,
            isDashing: false,
            dashTimer: 0,
            angle: 0,
            powerup: null, // 'TRIPLE_SHOT', 'LASER', 'SHIELD'
            powerupTime: 0,
            shieldActive: false,
            
            reset() {
                this.x = canvas.width * 0.2;
                this.y = canvas.height / 2;
                this.vy = 0;
                this.hp = 100;
                this.dashEnergy = 100;
                this.dashCooldown = false;
                this.isDashing = false;
                this.powerup = null;
                this.powerupTime = 0;
                this.shieldActive = false;
                this.angle = 0;
            },

            flap() {
                this.vy = this.jumpStrength;
                createFeathers(this.x, this.y);
                audio.playJump();
            },

            shoot() {
                if (this.powerup === 'LASER') {
                    // Fast beam / multi-bullet
                    bullets.push(new Bullet(this.x + 20, this.y, 16, 0, 'laser'));
                } else if (this.powerup === 'TRIPLE_SHOT') {
                    bullets.push(new Bullet(this.x + 20, this.y, 12, -2, 'normal'));
                    bullets.push(new Bullet(this.x + 20, this.y, 12, 0, 'normal'));
                    bullets.push(new Bullet(this.x + 20, this.y, 12, 2, 'normal'));
                } else {
                    bullets.push(new Bullet(this.x + 20, this.y, 12, 0, 'normal'));
                }
                audio.playShoot();
            },

            dash() {
                if (this.dashEnergy >= 100 && !this.isDashing) {
                    this.isDashing = true;
                    this.dashTimer = 12; // Frames of dash
                    this.dashEnergy = 0;
                    this.vy = 0;
                    audio.playDash();
                    triggerScreenShake(8);
                }
            },

            update() {
                // Physics
                if (this.isDashing) {
                    this.dashTimer--;
                    this.vy = 0;
                    this.x += 8; // Burst forward
                    createParticles(this.x - 10, this.y, '#f59e0b', 3, 2);
                    if (this.dashTimer <= 0) {
                        this.isDashing = false;
                    }
                } else {
                    this.vy += this.gravity;
                    this.y += this.vy;
                    // Slowly drift back to normal x anchor
                    const targetX = canvas.width * 0.2;
                    if (this.x > targetX) this.x -= (this.x - targetX) * 0.05;
                }

                // Smooth rotation based on vertical speed
                this.angle = Math.min(Math.PI / 4, Math.max(-Math.PI / 4, (this.vy * 0.07)));

                // Floor / Ceiling Boundaries
                if (this.y - this.radius < 0) {
                    this.y = this.radius;
                    this.vy = 0;
                }
                if (this.y + this.radius > canvas.height - 30) { // 30px ground height
                    this.y = canvas.height - 30 - this.radius;
                    this.takeDamage(10);
                    this.flap();
                }

                // Recharge Dash Energy
                if (this.dashEnergy < 100) {
                    this.dashEnergy += 0.8;
                }

                // Powerup Timer
                if (this.powerupTime > 0) {
                    this.powerupTime--;
                    if (this.powerupTime <= 0) {
                        this.powerup = null;
                        this.shieldActive = false;
                        activePowerupDisplay.classList.add('hidden');
                    }
                }
            },

            takeDamage(amount) {
                if (this.shieldActive) {
                    this.shieldActive = false;
                    this.powerup = null;
                    activePowerupDisplay.classList.add('hidden');
                    audio.playHit();
                    createParticles(this.x, this.y, '#38bdf8', 12, 4);
                    return;
                }
                this.hp -= amount;
                audio.playHit();
                triggerScreenShake(12);
                createParticles(this.x, this.y, '#ef4444', 10, 3);
                combo = 0;
                updateComboUI();

                if (this.hp <= 0) {
                    this.hp = 0;
                    endGame();
                }
            },

            draw() {
                ctx.save();
                ctx.translate(this.x, this.y);
                ctx.rotate(this.angle);

                // Draw Shield Effect if active
                if (this.shieldActive) {
                    ctx.beginPath();
                    ctx.arc(0, 0, this.radius + 8, 0, Math.PI * 2);
                    ctx.strokeStyle = '#38bdf8';
                    ctx.lineWidth = 3;
                    ctx.shadowColor = '#38bdf8';
                    ctx.shadowBlur = 10;
                    ctx.stroke();
                }

                // Bird Body
                ctx.beginPath();
                ctx.arc(0, 0, this.radius, 0, Math.PI * 2);
                ctx.fillStyle = this.isDashing ? '#fbbf24' : '#06b6d4';
                ctx.fill();
                ctx.lineWidth = 2;
                ctx.strokeStyle = '#ffffff';
                ctx.stroke();

                // Bird Eye
                ctx.beginPath();
                ctx.arc(8, -5, 5, 0, Math.PI * 2);
                ctx.fillStyle = '#ffffff';
                ctx.fill();
                ctx.beginPath();
                ctx.arc(10, -5, 2, 0, Math.PI * 2);
                ctx.fillStyle = '#0f172a';
                ctx.fill();

                // Beak / Laser Cannon
                ctx.beginPath();
                ctx.moveTo(12, 2);
                ctx.lineTo(24, 6);
                ctx.lineTo(12, 10);
                ctx.closePath();
                ctx.fillStyle = '#f97316';
                ctx.fill();

                // Wing
                ctx.beginPath();
                ctx.ellipse(-4, 2, 10, 6, Math.PI / 4 + (this.vy * 0.05), 0, Math.PI * 2);
                ctx.fillStyle = '#0284c7';
                ctx.fill();

                ctx.restore();
            }
        };

        let bullets = [];
        let enemies = [];
        let obstacles = [];
        let powerups = [];
        let particles = [];

        // --- BULLET CLASS ---
        class Bullet {
            constructor(x, y, vx, vy, type) {
                this.x = x;
                this.y = y;
                this.vx = vx;
                this.vy = vy;
                this.radius = type === 'laser' ? 4 : 5;
                this.type = type;
                this.markedForDeletion = false;
            }

            update() {
                this.x += this.vx;
                this.y += this.vy;
                if (this.x > canvas.width + 50) this.markedForDeletion = true;

                // Trail effect
                if (Math.random() < 0.5) {
                    particles.push(new Particle(this.x, this.y, this.type === 'laser' ? '#a855f7' : '#facc15', 2, 1));
                }
            }

            draw() {
                ctx.save();
                ctx.beginPath();
                ctx.arc(this.x, this.y, this.radius, 0, Math.PI * 2);
                ctx.fillStyle = this.type === 'laser' ? '#c084fc' : '#fde047';
                ctx.shadowColor = this.type === 'laser' ? '#a855f7' : '#eab308';
                ctx.shadowBlur = 8;
                ctx.fill();
                ctx.restore();
            }
        }

        // --- ENEMY CLASS ---
        class Enemy {
            constructor() {
                this.x = canvas.width + 40;
                this.y = Math.random() * (canvas.height - 120) + 40;
                this.radius = Math.random() > 0.5 ? 18 : 24; // Small fast vs Large tanky
                this.speed = Math.random() * 2 + 2 + (distance * 0.001);
                this.hp = this.radius > 20 ? 3 : 1;
                this.maxHp = this.hp;
                this.type = this.radius > 20 ? 'drone' : 'bat';
                this.sinOffset = Math.random() * Math.PI * 2;
                this.markedForDeletion = false;
            }

            update() {
                this.x -= this.speed;
                // Wave movement for bats
                if (this.type === 'bat') {
                    this.y += Math.sin(this.x * 0.02 + this.sinOffset) * 1.5;
                }

                if (this.x < -50) this.markedForDeletion = true;
            }

            draw() {
                ctx.save();
                ctx.translate(this.x, this.y);

                if (this.type === 'bat') {
                    // Corrupted Bat
                    ctx.fillStyle = '#e11d48';
                    ctx.beginPath();
                    ctx.arc(0, 0, this.radius, 0, Math.PI * 2);
                    ctx.fill();
                    // Bat Wings
                    ctx.fillStyle = '#9f1239';
                    ctx.beginPath();
                    ctx.moveTo(-10, 0);
                    ctx.lineTo(-this.radius - 10, -10);
                    ctx.lineTo(-5, 5);
                    ctx.fill();
                    ctx.beginPath();
                    ctx.moveTo(10, 0);
                    ctx.lineTo(this.radius + 10, -10);
                    ctx.lineTo(5, 5);
                    ctx.fill();
                } else {
                    // Armored Drone
                    ctx.fillStyle = '#475569';
                    ctx.strokeStyle = '#38bdf8';
                    ctx.lineWidth = 2;
                    ctx.beginPath();
                    ctx.arc(0, 0, this.radius, 0, Math.PI * 2);
                    ctx.fill();
                    ctx.stroke();

                    // Drone Eye
                    ctx.fillStyle = '#ef4444';
                    ctx.beginPath();
                    ctx.arc(-4, 0, 6, 0, Math.PI * 2);
                    ctx.fill();
                }

                // HP Bar if damaged
                if (this.hp < this.maxHp) {
                    ctx.fillStyle = 'rgba(0,0,0,0.5)';
                    ctx.fillRect(-15, -this.radius - 10, 30, 4);
                    ctx.fillStyle = '#ef4444';
                    ctx.fillRect(-15, -this.radius - 10, (this.hp / this.maxHp) * 30, 4);
                }

                ctx.restore();
            }
        }

        // --- OBSTACLE (PIPE / LASER WALL) CLASS ---
        class PipeObstacle {
            constructor() {
                this.x = canvas.width + 60;
                this.width = 50;
                this.gap = 160;
                this.topHeight = Math.random() * (canvas.height - this.gap - 140) + 40;
                this.bottomY = this.topHeight + this.gap;
                this.speed = 2.5 + (distance * 0.0005);
                this.markedForDeletion = false;
                this.passed = false;
            }

            update() {
                this.x -= this.speed;
                if (this.x + this.width < 0) this.markedForDeletion = true;

                // Award score for passing safely
                if (!this.passed && this.x + this.width < player.x) {
                    this.passed = true;
                    addScore(50);
                }
            }

            draw() {
                ctx.save();
                ctx.fillStyle = '#334155';
                ctx.strokeStyle = '#0284c7';
                ctx.lineWidth = 3;

                // Top Pipe
                ctx.fillRect(this.x, 0, this.width, this.topHeight);
                ctx.strokeRect(this.x, 0, this.width, this.topHeight);

                // Bottom Pipe
                ctx.fillRect(this.x, this.bottomY, this.width, canvas.height - this.bottomY);
                ctx.strokeRect(this.x, this.bottomY, this.width, canvas.height - this.bottomY);

                // Tech Pipe End Caps
                ctx.fillStyle = '#0284c7';
                ctx.fillRect(this.x - 4, this.topHeight - 15, this.width + 8, 15);
                ctx.fillRect(this.x - 4, this.bottomY, this.width + 8, 15);

                ctx.restore();
            }
        }

        // --- POWERUP CLASS ---
        class Powerup {
            constructor() {
                this.x = canvas.width + 30;
                this.y = Math.random() * (canvas.height - 160) + 60;
                this.radius = 16;
                const types = ['TRIPLE_SHOT', 'LASER', 'SHIELD', 'HEAL'];
                this.type = types[Math.floor(Math.random() * types.length)];
                this.markedForDeletion = false;
                this.floatOffset = Math.random() * Math.PI * 2;
            }

            update() {
                this.x -= 2;
                this.y += Math.sin(this.x * 0.03 + this.floatOffset) * 1;
                if (this.x < -30) this.markedForDeletion = true;
            }

            draw() {
                ctx.save();
                ctx.translate(this.x, this.y);

                let color = '#38bdf8';
                let icon = '⚡';
                if (this.type === 'TRIPLE_SHOT') { color = '#f59e0b'; icon = '3x'; }
                if (this.type === 'LASER') { color = '#a855f7'; icon = 'L'; }
                if (this.type === 'SHIELD') { color = '#38bdf8'; icon = 'S'; }
                if (this.type === 'HEAL') { color = '#10b981'; icon = '+'; }

                ctx.beginPath();
                ctx.arc(0, 0, this.radius, 0, Math.PI * 2);
                ctx.fillStyle = color;
                ctx.shadowColor = color;
                ctx.shadowBlur = 10;
                ctx.fill();

                ctx.fillStyle = '#ffffff';
                ctx.font = 'bold 12px Orbitron';
                ctx.textAlign = 'center';
                ctx.textBaseline = 'middle';
                ctx.fillText(icon, 0, 1);

                ctx.restore();
            }
        }

        class Particle {
            constructor(x, y, color, speed = 3, size = 3) {
                this.x = x;
                this.y = y;
                this.color = color;
                this.vx = (Math.random() - 0.5) * speed;
                this.vy = (Math.random() - 0.5) * speed;
                this.size = Math.random() * size + 1;
                this.alpha = 1;
                this.lifeSpan = Math.random() * 20 + 20;
            }

            update() {
                this.x += this.vx;
                this.y += this.vy;
                this.alpha -= 1 / this.lifeSpan;
            }

            draw() {
                ctx.save();
                ctx.globalAlpha = Math.max(0, this.alpha);
                ctx.fillStyle = this.color;
                ctx.beginPath();
                ctx.arc(this.x, this.y, this.size, 0, Math.PI * 2);
                ctx.fill();
                ctx.restore();
            }
        }

        function createParticles(x, y, color, count = 8, speed = 3) {
            for (let i = 0; i < count; i++) {
                particles.push(new Particle(x, y, color, speed));
            }
        }

        function createFeathers(x, y) {
            for (let i = 0; i < 4; i++) {
                particles.push(new Particle(x - 10, y, '#e0f2fe', 2, 4));
            }
        }

        // Screen Shake Helper
        function triggerScreenShake(intensity = 6) {
            container.classList.remove('shake');
            void container.offsetWidth; // Force reflow
            container.classList.add('shake');
        }

        // --- PARALLAX BACKGROUND ---
        let bgOffset1 = 0;
        let bgOffset2 = 0;

        function drawBackground() {
            // Sky Gradient
            const gradient = ctx.createLinearGradient(0, 0, 0, canvas.height);
            gradient.addColorStop(0, '#0f172a');
            gradient.addColorStop(0.6, '#1e1b4b');
            gradient.addColorStop(1, '#311b92');
            ctx.fillStyle = gradient;
            ctx.fillRect(0, 0, canvas.width, canvas.height);

            // Parallax Mountains (Distant)
            bgOffset1 -= 0.3;
            if (bgOffset1 <= -canvas.width) bgOffset1 = 0;

            ctx.fillStyle = 'rgba(30, 41, 59, 0.5)';
            ctx.beginPath();
            ctx.moveTo(bgOffset1, canvas.height);
            ctx.lineTo(bgOffset1 + 100, canvas.height - 120);
            ctx.lineTo(bgOffset1 + 250, canvas.height - 40);
            ctx.lineTo(bgOffset1 + 400, canvas.height - 180);
            ctx.lineTo(bgOffset1 + 600, canvas.height - 50);
            ctx.lineTo(bgOffset1 + canvas.width, canvas.height);
            ctx.fill();

            // Repeating second loop for background
            ctx.beginPath();
            ctx.moveTo(bgOffset1 + canvas.width, canvas.height);
            ctx.lineTo(bgOffset1 + canvas.width + 100, canvas.height - 120);
            ctx.lineTo(bgOffset1 + canvas.width + 250, canvas.height - 40);
            ctx.lineTo(bgOffset1 + canvas.width + 400, canvas.height - 180);
            ctx.lineTo(bgOffset1 + canvas.width + 600, canvas.height - 50);
            ctx.lineTo(bgOffset1 + canvas.width * 2, canvas.height);
            ctx.fill();

            // Foreground Ground Line
            bgOffset2 -= 2;
            if (bgOffset2 <= -40) bgOffset2 = 0;
            ctx.fillStyle = '#0284c7';
            ctx.fillRect(0, canvas.height - 30, canvas.width, 30);
            ctx.fillStyle = '#0369a1';
            for (let x = bgOffset2; x < canvas.width; x += 40) {
                ctx.fillRect(x, canvas.height - 30, 20, 30);
            }
        }

        let spawnTimer = 0;
        let pipeTimer = 0;

        function checkCollisions() {
            // Bullets vs Enemies
            bullets.forEach(bullet => {
                enemies.forEach(enemy => {
                    const dist = Math.hypot(bullet.x - enemy.x, bullet.y - enemy.y);
                    if (dist < bullet.radius + enemy.radius) {
                        bullet.markedForDeletion = true;
                        enemy.hp--;
                        createParticles(bullet.x, bullet.y, '#fde047', 6, 2);

                        if (enemy.hp <= 0) {
                            enemy.markedForDeletion = true;
                            kills++;
                            addScore(100);
                            increaseCombo();
                            audio.playExplosion();
                            createParticles(enemy.x, enemy.y, '#ef4444', 15, 4);
                        }
                    }
                });
            });

            // Player vs Enemies
            enemies.forEach(enemy => {
                const dist = Math.hypot(player.x - enemy.x, player.y - enemy.y);
                if (dist < player.radius + enemy.radius) {
                    if (player.isDashing) {
                        // Dash destroys enemy effortlessly
                        enemy.markedForDeletion = true;
                        kills++;
                        addScore(150);
                        increaseCombo();
                        audio.playExplosion();
                        createParticles(enemy.x, enemy.y, '#f59e0b', 20, 5);
                    } else {
                        enemy.markedForDeletion = true;
                        player.takeDamage(20);
                    }
                }
            });

            // Player vs Pipes / Obstacles
            obstacles.forEach(pipe => {
                // Check top pipe bounds
                if (player.x + player.radius > pipe.x && player.x - player.radius < pipe.x + pipe.width) {
                    if (player.y - player.radius < pipe.topHeight || player.y + player.radius > pipe.bottomY) {
                        if (player.isDashing) {
                            // Dashing reduces damage taken when crashing through or past obstacle
                            player.takeDamage(10);
                        } else {
                            player.takeDamage(25);
                            player.vy = 4; // Knockback down
                        }
                    }
                }
            });

            // Player vs Powerups
            powerups.forEach(pw => {
                const dist = Math.hypot(player.x - pw.x, player.y - pw.y);
                if (dist < player.radius + pw.radius) {
                    pw.markedForDeletion = true;
                    audio.playPowerup();

                    if (pw.type === 'HEAL') {
                        player.hp = Math.min(player.maxHp, player.hp + 30);
                    } else {
                        player.powerup = pw.type;
                        player.powerupTime = 400; // ~6.6 seconds
                        if (pw.type === 'SHIELD') player.shieldActive = true;
                        
                        activePowerupDisplay.classList.remove('hidden');
                        powerupText.innerText = pw.type.replace('_', ' ');
                    }

                    createParticles(pw.x, pw.y, '#10b981', 12, 3);
                }
            });
        }

        function addScore(pts) {
            const multiplier = Math.max(1, combo);
            score += pts * multiplier;
            scoreDisplay.innerText = score;
        }

        function increaseCombo() {
            combo++;
            if (combo > maxCombo) maxCombo = combo;
            comboCount.innerText = 'x' + combo;
            comboDisplay.classList.remove('opacity-0', 'scale-75');
            comboDisplay.classList.add('opacity-100', 'scale-100');
        }

        function updateComboUI() {
            if (combo <= 0) {
                comboDisplay.classList.remove('opacity-100', 'scale-100');
                comboDisplay.classList.add('opacity-0', 'scale-75');
            }
        }

        function updateHUD() {
            hpFill.style.width = `${Math.max(0, (player.hp / player.maxHp) * 100)}%`;
            hpText.innerText = `${Math.ceil(player.hp)}/100`;

            dashFill.style.width = `${player.dashEnergy}%`;
            dashText.innerText = player.dashEnergy >= 100 ? 'DASH READY' : 'RECHARGING...';
            dashText.className = player.dashEnergy >= 100 ? 'text-[10px] font-bold font-mono text-amber-300' : 'text-[10px] font-bold font-mono text-slate-400';
        }

        function gameLoop() {
            if (!isRunning) return;

            // Clear Canvas
            ctx.clearRect(0, 0, canvas.width, canvas.height);

            // Draw Parallax World
            drawBackground();

            // Distance Progress
            distance += 1;

            // Spawning Logic
            spawnTimer++;
            pipeTimer++;

            // Spawn Enemies
            if (spawnTimer > Math.max(40, 100 - Math.floor(distance * 0.01))) {
                enemies.push(new Enemy());
                spawnTimer = 0;
            }

            // Spawn Pipes / Obstacles
            if (pipeTimer > 160) {
                obstacles.push(new PipeObstacle());
                pipeTimer = 0;

                // Occasional Powerup Spawn with pipes
                if (Math.random() < 0.4) {
                    powerups.push(new Powerup());
                }
            }

            // Update Entities
            player.update();
            bullets.forEach(b => b.update());
            enemies.forEach(e => e.update());
            obstacles.forEach(o => o.update());
            powerups.forEach(p => p.update());
            particles.forEach(p => p.update());

            // Check Collisions
            checkCollisions();

            // Filter out destroyed elements
            bullets = bullets.filter(b => !b.markedForDeletion);
            enemies = enemies.filter(e => !e.markedForDeletion);
            obstacles = obstacles.filter(o => !o.markedForDeletion);
            powerups = powerups.filter(p => !p.markedForDeletion);
            particles = particles.filter(p => p.alpha > 0);

            // Draw Entities
            obstacles.forEach(o => o.draw());
            enemies.forEach(e => e.draw());
            bullets.forEach(b => b.draw());
            powerups.forEach(p => p.draw());
            particles.forEach(p => p.draw());
            player.draw();

            // Update HUD
            updateHUD();

            requestAnimationFrame(gameLoop);
        }

        function startGame() {
            audio.init();
            isRunning = true;
            score = 0;
            kills = 0;
            distance = 0;
            combo = 0;
            maxCombo = 0;
            bullets = [];
            enemies = [];
            obstacles = [];
            powerups = [];
            particles = [];
            
            player.reset();
            scoreDisplay.innerText = '0';
            updateComboUI();

            mainMenu.classList.add('hidden');
            gameOverMenu.classList.add('hidden');
            hud.classList.remove('hidden');
            mobileControls.classList.remove('hidden');

            requestAnimationFrame(gameLoop);
        }

        function endGame() {
            isRunning = false;
            hud.classList.add('hidden');
            mobileControls.classList.add('hidden');
            gameOverMenu.classList.remove('hidden');

            // Save High Score
            if (score > highScore) {
                highScore = score;
                localStorage.setItem('flappy_combat_highscore', highScore);
                bestScoreDisplay.innerText = highScore;
            }

            // Populate End Screen Stats
            finalScore.innerText = score;
            finalKills.innerText = kills;
            finalDistance.innerText = `${Math.floor(distance / 10)}m`;
            finalCombo.innerText = `x${maxCombo}`;
        }

        // --- KEYBOARD CONTROLS ---
        window.addEventListener('keydown', (e) => {
            if (!isRunning) return;

            if (e.code === 'Space') {
                e.preventDefault();
                player.flap();
            }
            if (e.code === 'KeyF' || e.code === 'KeyJ') {
                e.preventDefault();
                player.shoot();
            }
            if (e.code === 'KeyD' || e.code === 'KeyK') {
                e.preventDefault();
                player.dash();
            }
        });

        // Canvas Click for Flap
        canvas.addEventListener('mousedown', (e) => {
            if (isRunning && e.button === 0) {
                player.flap();
            }
        });

        // Touch Controls & Button Attachments
        document.getElementById('start-btn').addEventListener('click', startGame);
        document.getElementById('restart-btn').addEventListener('click', startGame);

        document.getElementById('btn-flap').addEventListener('touchstart', (e) => {
            e.preventDefault();
            if (isRunning) player.flap();
        });
        document.getElementById('btn-shoot').addEventListener('touchstart', (e) => {
            e.preventDefault();
            if (isRunning) player.shoot();
        });
        document.getElementById('btn-dash').addEventListener('touchstart', (e) => {
            e.preventDefault();
            if (isRunning) player.dash();
        });

        // Click fallbacks for mobile preview buttons on desktop
        document.getElementById('btn-flap').addEventListener('click', () => { if (isRunning) player.flap(); });
        document.getElementById('btn-shoot').addEventListener('click', () => { if (isRunning) player.shoot(); });
        document.getElementById('btn-dash').addEventListener('click', () => { if (isRunning) player.dash(); });

    </script>
</body>
